<html lang="en">
<head>
  <meta charset="UTF-8">
  <title id="page-title"></title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/film_location.css">
</head>
<body>

<!-- ---------------------------------------
               NAV BAR
--------------------------------------------- -->
    <nav  class="d-flex align-items-center sticky-top navbar">
    <ul class="nav-links">
        <li class="dropdown"><a href="index.html">COVER</a></li>
        <li class="dropdown"><a href="map.html">MAP</a></li>

    </ul>

<div class="location-page">
<!-- ---------------------------------------
               LEFT SIDE
--------------------------------------------- -->
  <div class="location-left">
    <div class="location-header">
      <h1 id="location-title"></h1>

      <div class="image-carousel">
        <button class="carousel-btn prev-btn" aria-label="Previous image">&#10094;</button>
        <div class="carousel-track" id="carousel-track"></div>
        <button class="carousel-btn next-btn" aria-label="Next image">&#10095;</button>
      </div>

      <div class="carousel-dots"></div>
    </div>

     <img id="qr" src="">

     
  </div>


<!-- ---------------------------------------
               RIGHT SIDE
--------------------------------------------- -->

  <div class="location-right">


      <div class="set">
        <h4>About the Location</h4>
      </div>


  <div class="buttons">
    <div class="length-buttons">
      <span class="control-label">Length:</span>
      <button class="length-btn active" data-length="brief">Brief</button>
      <button class="length-btn" data-length="standard">Standard</button>
      <button class="length-btn" data-length="indepth">In-depth</button>
    </div>

    <div class="control-buttons">
      <span class="control-label">Level:</span>
      <button class="level-btn active" data-level="beginner">Beginner</button>
      <button class="level-btn" data-level="general">General</button>
      <button class="level-btn" data-level="expert">Expert</button>
    </div>
  </div>

  <p id="film-text"></p>


  <div class="metadata-set">
    <h4>Metadata</h4>
  </div>

  <div class="entity-table">
    <table>
    <tbody>
      <tr>
        <td>Film</td>
        <td id="metadeta-film"></td>
      </tr>
      <tr>
        <td>Year</td>
        <td id="metadata-year"></td>
      </tr>
      <tr>
        <td>Address</td>
        <td id="metadeta-address"></td>
      </tr>
      <tr>
        <td>Scene description</td>
        <td id="metadata-scene"></td>
      </tr>
      <tr>
        <td>Camera angle</td>
        <td id="metadata-angle"></td>
      </tr>
    </tbody>
    </table>
  </div>

  <div class="fun-fact-set">
        <h4>Did you know?</h4>
        <p id="fun_fact"></p>
  </div>



  </div><!-- location-right -->


</div>

</html>
