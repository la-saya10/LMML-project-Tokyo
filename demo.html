<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>最小デモ</title>
<style>
  body { font-family: sans-serif; padding: 2em; }
  .box { border: 2px solid #333; padding: 1em; max-width: 400px; }
</style>
</head>
<body>

<h2>これは「空っぽの入れ物」です</h2>

<div class="box">
  <h1 id="my-title">（ここは最初、空です）</h1>
  <p id="my-desc">（ここも最初、空です）</p>
</div>

<hr>
<p>今のURL: <span id="show-url"></span></p>

<script>
  // ここから、locations-data.js に相当する部分
  const data = {
    "neko": {
      title: "ねこ",
      desc: "かわいい生き物です。"
    },
    "inu": { 
      title: "いぬ",
      desc: "忠実な生き物です。"
    }
  };

  // ここから、film_location.js に相当する部分

  // ① URLの ?id= のあとの文字（inuやneko）を読み取る
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  document.getElementById("show-url").textContent = window.location.href;

  // ② dataの中から、対応する項目を探す
  const item = data[id];

  // ③ 見つかった内容を、空っぽの入れ物に書き込む
  if (item) {
    document.getElementById("my-title").textContent = item.title;
    document.getElementById("my-desc").textContent = item.desc;
  } else {
    document.getElementById("my-title").textContent = "（該当データなし）";
    document.getElementById("my-desc").textContent = "URLの末尾に ?id=neko または ?id=inu をつけてみてください";
  }
</script>

</body>
</html>
